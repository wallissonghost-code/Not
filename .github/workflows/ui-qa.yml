name: NOT UI QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run mobile and desktop QA
        run: npm run test:ui

      - name: Upload QA report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: not-ui-qa-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
